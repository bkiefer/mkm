name: mvn build

# should avoid error in last action, does not work
# permissions:
#   contents: read
#   pages: write
#   id-token: write

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: true
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    - name: compile VOnDA, compile Rudi file and build with Maven
      run: |
        cd modules/vonda
        mvn clean install -DskipTests
        cd ../..
        ./modules/vonda/bin/vondac -c config.yml
        mvn -B package --file pom.xml

    # Optional: Uploads the full dependency graph to GitHub to improve the
    # quality of Dependabot alerts this repository can receive
    # Action Fails with error:
    # Unable to get ACTIONS_ID_TOKEN_REQUEST_URL env variable
    # - name: Update dependency graph
    #   uses: advanced-security/maven-dependency-submission-action@v4.0.3
